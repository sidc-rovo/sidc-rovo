name: Deploy site

# Publishes site/ to GitHub Pages, and generates the derived state first.
#
# Runs on every push to main rather than only on site/** changes, because
# build-info.json and the release notes are derived from git history — they
# change on every commit even when no file under site/ does.
#
# One-time manual step already done: Settings → Pages → Source: GitHub Actions.
# It cannot be automated — configure-pages(enablement: true) fails with
# "Resource not accessible by integration" because the default GITHUB_TOKEN has
# no admin rights to create a Pages site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are built from the whole log, so a shallow clone would
          # silently truncate them.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate derived state
        # --docs-only reads nothing but git, so this needs no Atlassian
        # credentials and cannot fail on a network hiccup.
        run: python scripts/atlassian_sync.py --docs-only

      - name: Publish release notes alongside the site
        run: |
          mkdir -p site/releases
          cp -r docs/releases/. site/releases/
          # index.html is what makes the bare /releases/ URL work — Pages does
          # not treat README.md as a directory index.
          test -f site/releases/index.html || { echo "release index missing"; exit 1; }
          echo "release notes staged at /releases/"

      - name: Sanity-check the site
        run: |
          # index.html and app.js are the only hard requirements. styles.css and
          # the portrait are intentionally absent from the plain baseline and get
          # added back by the design work, so they must not gate a deploy.
          test -f site/index.html || { echo "site/index.html missing"; exit 1; }
          test -f site/app.js || { echo "site/app.js missing"; exit 1; }
          test -f site/build-info.json || { echo "build-info.json not generated"; exit 1; }
          test -f site/releases/index.html || { echo "release notes not staged"; exit 1; }
          echo "site/ is complete"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
