name: Deploy site

# Publishes site/ to GitHub Pages.
#
# One-time manual step: Settings → Pages → Source: GitHub Actions.
# This cannot be automated — configure-pages(enablement: true) fails with
# "Resource not accessible by integration" because the default GITHUB_TOKEN
# has no admin rights to create a Pages site. Until it's enabled by hand,
# this workflow fails on the configure step; everything after it is fine.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  # Also deploy after Atlassian sync finishes. That job commits the refreshed
  # build-info.json with [skip ci] — necessary, because build-info carries a
  # synced_at timestamp that changes every run and would otherwise retrigger
  # the sync forever. But [skip ci] also suppresses the push trigger above,
  # which left the live Delivery panel permanently one commit stale. This
  # trigger is how that commit reaches Pages.
  workflow_run:
    workflows: ["Atlassian sync"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # ref: main explicitly — on a workflow_run event the default checkout is
      # the SHA that started the upstream run, which predates the build-info
      # commit we are here to deploy.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Sanity-check the site
        run: |
          test -f site/index.html || { echo "site/index.html missing"; exit 1; }
          test -f site/styles.css || { echo "site/styles.css missing"; exit 1; }
          test -f site/assets/sidc.jpeg || { echo "portrait missing"; exit 1; }
          echo "site/ looks complete"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
