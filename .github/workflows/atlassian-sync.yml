name: Atlassian sync

# Authoritative sync. The local post-commit hook gives instant feedback; this
# run is the one that must be correct, and its logs are the audit trail.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      resync_all:
        description: "Re-sync the entire history instead of just this push"
        type: boolean
        default: false

concurrency:
  # Never let two syncs race on the same Confluence page version.
  group: atlassian-sync
  cancel-in-progress: false

permissions:
  contents: read   # nothing is written back to the repo any more

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # The Confluence pages are rebuilt from the whole log, so a shallow
          # clone would silently truncate them.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the commit range
        id: range
        run: |
          if [ "${{ inputs.resync_all }}" = "true" ]; then
            echo "args=--all" >> "$GITHUB_OUTPUT"
            echo "Re-syncing all history (manual dispatch)"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            # New branch, force-push, or a rewritten base — no usable range.
            echo "args=--all" >> "$GITHUB_OUTPUT"
            echo "No usable 'before' SHA; falling back to full history"
          else
            echo "args=--range ${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "Range: ${{ github.event.before }}..${{ github.sha }}"
          fi

      - name: Sync Jira and Confluence
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
        run: python scripts/atlassian_sync.py ${{ steps.range.outputs.args }}

      # No commit step. Generated state (docs/releases, build-info.json) is
      # git-ignored and rebuilt at deploy time by pages.yml, which needs no
      # credentials for it. That removes the bot commit, the CI-skip dance, and
      # the dirty working tree the old approach left behind after every commit.
